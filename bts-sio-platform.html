<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTS SIO 1 - Plateforme de Révision Interactive</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Mermaid pour les schémas -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    
    <style>
        /* ===== ANIMATIONS FLUIDES ===== */
        * {
            transition: all 0.3s ease-in-out;
        }
        
        /* Transition 3D pour Flashcards */
        .flashcard {
            perspective: 1000px;
            cursor: pointer;
            height: 300px;
        }
        
        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        
        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }
        
        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            text-align: center;
        }
        
        .flashcard-front {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
        }
        
        .flashcard-back {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
            transform: rotateY(180deg);
        }
        
        /* Mode Sombre */
        body.dark .flashcard-front {
            background: linear-gradient(135deg, #312e81, #4c1d95);
            color: #e0e7ff;
        }
        
        body.dark .flashcard-back {
            background: linear-gradient(135deg, #164e63, #0c4a6e);
            color: #cffafe;
        }
        
        /* Animations pour les options de quiz */
        .quiz-option {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .quiz-option:hover:not(.disabled) {
            transform: translateX(4px);
        }
        
        .quiz-option.correct {
            background-color: #dcfce7;
            border-color: #22c55e;
            animation: pulse-correct 0.6s ease;
        }
        
        .quiz-option.incorrect {
            background-color: #fee2e2;
            border-color: #ef4444;
            animation: shake 0.3s ease;
        }
        
        @keyframes pulse-correct {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        /* Mode Sombre personnalisé */
        body.dark {
            background-color: #0f172a;
            color: #e2e8f0;
        }
        
        body.dark .sidebar {
            background-color: #1e293b;
            border-right: 1px solid #334155;
        }
        
        body.dark .menu-item {
            color: #cbd5e1;
        }
        
        body.dark .menu-item.active {
            background-color: #4f46e5;
            color: white;
        }
        
        body.dark .menu-item:hover {
            background-color: #334155;
        }
        
        body.dark .submenu-item {
            color: #a1a5af;
        }
        
        body.dark .submenu-item.active {
            background-color: #6366f1;
            color: white;
        }
        
        body.dark .content-area {
            background-color: #1e293b;
            color: #e2e8f0;
        }
        
        body.dark .tab-btn {
            color: #cbd5e1;
        }
        
        body.dark .tab-btn.active {
            color: #4f46e5;
            border-color: #4f46e5;
        }
        
        body.dark .alert {
            background-color: #1e3a1f;
            border-color: #22c55e;
            color: #bbf7d0;
        }
        
        body.dark .alert.warning {
            background-color: #3f2615;
            border-color: #f59e0b;
            color: #fbbf24;
        }
        
        body.dark .alert.info {
            background-color: #0c2d4a;
            border-color: #0ea5e9;
            color: #7dd3fc;
        }
        
        body.dark .lesson-box {
            background-color: #334155;
            border-left-color: #4f46e5;
        }
        
        body.dark .quiz-option {
            background-color: #334155;
            border-color: #475569;
            color: #e2e8f0;
        }
        
        body.dark .quiz-option.correct {
            background-color: #1e3a1f;
            border-color: #22c55e;
        }
        
        body.dark .quiz-option.incorrect {
            background-color: #3f1f1f;
            border-color: #ef4444;
        }
        
        /* Slider pour le menu mobile */
        .sidebar.open {
            left: 0;
        }
        
        /* Scrollbar personnalisée */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        
        body.dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        
        /* Animation de chargement */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease;
        }
        
        /* Schémas Mermaid */
        .mermaid {
            display: flex;
            justify-content: center;
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        body.dark .mermaid {
            background: #334155;
        }
        
        .mermaid svg {
            max-width: 100%;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -100%;
                top: 0;
                width: 100%;
                height: 100vh;
                z-index: 50;
            }
            
            .sidebar.open {
                left: 0;
                width: 80%;
            }
            
            .overlay {
                display: none;
            }
            
            .overlay.open {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 40;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 overflow-hidden">

                <a href="index.html" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" title="Retour">

                </a>
            </div>
        </div>
    </header>
    
    <!-- OVERLAY (Mobile) ===== -->

                <!-- MENU 1: EDMN -->

                        <i class="fas fa-balance-scale mr-3"></i>EDMN

                    <div class="submenu space-y-1 pl-4 mt-2 hidden" id="edmn-submenu">

                </div>
                
                <!-- ONGLET 1: COURS ===== -->

    <!-- SCRIPTS ===== -->

    <script src="bts-sio-app.js"></script>

</html>
